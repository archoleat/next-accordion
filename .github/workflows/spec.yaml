name: Spec

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'patches/**'
      - 'README.md'
      - 'src/**/*.tsx'
      - 'src/**/*.ts'
      - 'src/**'
      - 'specs/**'
      - 'bun.lock'
      - 'bun.lockb'
      - 'bunfig.toml'
      - 'tsconfig*.json'
      - '*.config.*'
      - '.npmrc'
      - '.bun-version'
      - '.node-version'
      - '.nvmrc'
      - '.github/workflows/**'
      - '.pre-commit-config.yaml'
      - '.editorconfig'
      - '.editorconfig-checker.json'
      - '.prettierignore'

permissions:
  contents: read

jobs:
  spec:
    name: Spec

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Filter Changed Files
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != 'pull_request' ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$BASE_SHA...$HEAD_SHA" -- \
              ':(glob)package.json' \
              ':(glob)patches/**' \
              ':(glob)README.md' \
              ':(glob)src/**/*.tsx' \
              ':(glob)src/**/*.ts' \
              ':(glob)src/**' \
              ':(glob)specs/**' \
              ':(glob)bun.lock' \
              ':(glob)bun.lockb' \
              ':(glob)bunfig.toml' \
              ':(glob)tsconfig*.json' \
              ':(glob)*.config.*' \
              ':(glob).npmrc' \
              ':(glob).bun-version' \
              ':(glob).node-version' \
              ':(glob).nvmrc' \
              ':(glob).github/workflows/**' \
              ':(glob).pre-commit-config.yaml' \
              ':(glob).editorconfig' \
              ':(glob).editorconfig-checker.json' \
              ':(glob).prettierignore'; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            status=$?

            if (( status != 1 )); then
              exit "$status"
            fi

            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Set Up Bun
        if: ${{ steps.changes.outputs.run == 'true' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install Dependencies
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: bun ci

      - name: Specs
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: bun test
